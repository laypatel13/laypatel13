<svg xmlns="http://www.w3.org/2000/svg" width="800" height="240" viewBox="0 0 800 240">
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; fill: #e6edf3; white-space: pre; }
    .dim { fill: #7d8590; }
    .b { fill: #4285f4; }
    .r { fill: #ea4335; }
    .y { fill: #fbbc05; }
    .g { fill: #34a853; }
    .bold { font-weight: 700; }
    .l { animation: in .4s ease-out backwards; }
    .l1 { animation-delay: .1s; } .l2 { animation-delay: .6s; } .l3 { animation-delay: 1.1s; }
    .l4 { animation-delay: 1.3s; } .l5 { animation-delay: 1.5s; } .l6 { animation-delay: 2s; }
    .cursor { animation: blink 1s step-end infinite; }
    @keyframes in { from { opacity: 0; } }
    .float { animation: float 3s ease-in-out infinite; }
    .sparkle { animation: twinkle 2.4s ease-in-out infinite; }
    .s2 { animation-delay: .6s; } .s3 { animation-delay: 1.2s; } .s4 { animation-delay: 1.8s; }
    @keyframes float { 50% { transform: translateY(-6px); } }
    @keyframes twinkle { 50% { opacity: .25; } }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <g class="l l1"><text x="8" y="36"><tspan class="g">$ </tspan>whoami</text></g>
  <g class="l l2"><text x="8" y="64">  <tspan class="bold">laypatel13</tspan><tspan class="dim"> · i make things, sometimes they work.</tspan></text></g>

  <g class="l l3"><text x="8" y="112"><tspan class="b">  languages   </tspan>python<tspan class="dim"> · </tspan>javascript<tspan class="dim"> · </tspan>typescript<tspan class="dim"> · </tspan>c</text></g>
  <g class="l l4"><text x="8" y="140"><tspan class="r">  stack       </tspan>django<tspan class="dim"> · </tspan>fastapi<tspan class="dim"> · </tspan>react<tspan class="dim"> · </tspan>postgres</text></g>
  <g class="l l5"><text x="8" y="168"><tspan class="y">  currently   </tspan>learning + contributing to open source</text></g>

  <g class="l l6"><text x="8" y="216"><tspan class="g">$ </tspan><tspan class="cursor b">█</tspan></text></g>

  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity=".25"/>
    </filter>
    <g id="monkeyshape">
      <circle cx="-50" cy="4" r="18"/>
      <circle cx="50" cy="4" r="18"/>
      <circle cx="0" cy="4" r="46"/>
    </g>
  </defs>

  <g class="l l6" transform="translate(680 118)">
    <g class="float">
      <g transform="rotate(-8)">
        <use href="#monkeyshape" fill="#fff" stroke="#fff" stroke-width="16" filter="url(#shadow)"/>
        <circle cx="-50" cy="4" r="18" fill="#8b5a3c" stroke="#1f2328" stroke-width="3"/>
        <circle cx="50" cy="4" r="18" fill="#8b5a3c" stroke="#1f2328" stroke-width="3"/>
        <circle cx="-52" cy="4" r="9" fill="#f3c9a0"/>
        <circle cx="52" cy="4" r="9" fill="#f3c9a0"/>
        <circle cx="0" cy="4" r="46" fill="#8b5a3c" stroke="#1f2328" stroke-width="3"/>
        <circle cx="-15" cy="-2" r="17" fill="#f3c9a0"/>
        <circle cx="15" cy="-2" r="17" fill="#f3c9a0"/>
        <ellipse cx="0" cy="22" rx="29" ry="20" fill="#f3c9a0"/>
        <ellipse cx="-14" cy="-3" rx="5" ry="7" fill="#1f2328"/>
        <ellipse cx="14" cy="-3" rx="5" ry="7" fill="#1f2328"/>
        <circle cx="-12" cy="-6" r="2" fill="#fff"/>
        <circle cx="16" cy="-6" r="2" fill="#fff"/>
        <ellipse cx="-25" cy="14" rx="6" ry="4" fill="#ff8fa3" opacity=".7"/>
        <ellipse cx="25" cy="14" rx="6" ry="4" fill="#ff8fa3" opacity=".7"/>
        <path d="M-6 12 Q0 8 6 12 Q4 18 0 18 Q-4 18 -6 12 Z" fill="#5c3a26"/>
        <path d="M0 18 L0 22" stroke="#5c3a26" stroke-width="2" stroke-linecap="round"/>
        <clipPath id="mouth"><path d="M-11 22 Q0 25 11 22 Q9 35 0 35 Q-9 35 -11 22 Z"/></clipPath>
        <path d="M-11 22 Q0 25 11 22 Q9 35 0 35 Q-9 35 -11 22 Z" fill="#4a2c1d"/>
        <ellipse cx="0" cy="35" rx="7" ry="5" fill="#ff7a8f" clip-path="url(#mouth)"/>
      </g>
    </g>
    <path class="sparkle s1" transform="translate(-82 -54)" d="M0 -9 Q1 -1 9 0 Q1 1 0 9 Q-1 1 -9 0 Q-1 -1 0 -9Z" fill="#fbbc05"/>
    <path class="sparkle s2" transform="translate(80 -40)" d="M0 -7 Q1 -1 7 0 Q1 1 0 7 Q-1 1 -7 0 Q-1 -1 0 -7Z" fill="#4285f4"/>
    <path class="sparkle s3" transform="translate(74 62)" d="M0 -6 Q1 -1 6 0 Q1 1 0 6 Q-1 1 -6 0 Q-1 -1 0 -6Z" fill="#34a853"/>
    <path class="sparkle s4" transform="translate(-78 58)" d="M0 -5 Q1 -1 5 0 Q1 1 0 5 Q-1 1 -5 0 Q-1 -1 0 -5Z" fill="#ea4335"/>
  </g>
</svg>
