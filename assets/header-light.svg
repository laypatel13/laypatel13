  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; fill: #1f2328; white-space: pre; }
    .dim { fill: #656d76; }
    .b { fill: #1a73e8; }
    .r { fill: #d93025; }
    .y { fill: #f9ab00; }
    .g { fill: #1e8e3e; }
    .bold { font-weight: 700; }
    .l { animation: in .4s ease-out backwards; }
    .l1 { animation-delay: .1s; } .l2 { animation-delay: .6s; } .l3 { animation-delay: 1.1s; }
    .l4 { animation-delay: 1.3s; } .l5 { animation-delay: 1.5s; } .l6 { animation-delay: 2s; }
    rect.b { fill: #1a73e8; } rect.r { fill: #d93025; } rect.y { fill: #f9ab00; } rect.g { fill: #1e8e3e; }
    .board circle { fill: #656d76; opacity: .35; }
    .glider { animation: fly 16s steps(20) infinite 2.2s; transform: translate(-36px, -36px); }
    .p { opacity: 0; animation: 0.8s step-end infinite 2.2s; }
    .p0 { animation-name: p0; } .p1 { animation-name: p1; } .p2 { animation-name: p2; } .p3 { animation-name: p3; }
    @keyframes fly { from { transform: translate(-36px, -36px); } to { transform: translate(204px, 204px); } }
    @keyframes p0 { 0% { opacity: 1; } 25% { opacity: 0; } }
    @keyframes p1 { 0% { opacity: 0; } 25% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes p2 { 0% { opacity: 0; } 50% { opacity: 1; } 75% { opacity: 0; } }
    @keyframes p3 { 0% { opacity: 0; } 75% { opacity: 1; } 100% { opacity: 1; } }
    .cursor { animation: blink 1s step-end infinite; }
    @keyframes in { from { opacity: 0; } }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

